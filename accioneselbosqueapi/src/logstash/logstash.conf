input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  mutate {
    add_field => {
      "[@metadata][target_index]" => "logs-springboot-%{+YYYY.MM.dd}"
    }
  }

  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
    # remove_field => ["timestamp"]  # Puedes usar esto si tienes un campo extra no deseado
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
    ilm_enabled => false
    action => "create"
  }
  stdout {
    codec => rubydebug
  }
}
